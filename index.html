<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Academy: guia do curso de influenciador virtual com IA</title>
<meta name="description" content="Veja o que está incluso na IA Academy, curso online sobre criação de vídeos com IA sem aparecer. Página informativa de afiliado.">
<meta name="theme-color" content="#5b2eff">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#151030;
  --ink-soft:#241a52;
  --paper:#f4f2ff;
  --white:#ffffff;
  --violet:#5b2eff;
  --violet-deep:#3f1fc7;
  --sun:#ffc83d;
  --sun-deep:#c9921a;
  --mint:#2bd9a8;
  --rose:#ff5f8d;
  --neon:#c8ff00;
  --muted:#5c5778;
  --line:#d9d3f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.6;
}
h1,h2,h3{
  font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  line-height:1.08;
  letter-spacing:-0.02em;
}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a:focus-visible,summary:focus-visible,.btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.on-dark a:focus-visible,.on-dark .btn:focus-visible{outline-color:#fff}

/* Aviso do topo */
.notice{
  background:var(--ink);
  color:#d9d3f6;
  font-size:13px;
  text-align:center;
  padding:9px 16px;
}

/* Botão */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--sun);
  color:var(--ink);
  font-weight:700;
  font-size:17px;
  padding:16px 30px;
  border-radius:999px;
  text-decoration:none;
  box-shadow:0 6px 0 var(--sun-deep);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-deep)}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--sun-deep)}

/* Hero */
.hero{
  background:var(--violet);
  color:#fff;
  padding:56px 0 84px;
  overflow:hidden;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:40px;
  align-items:center;
}
.hero h1{
  font-size:clamp(36px,6vw,66px);
  font-weight:800;
  margin-bottom:20px;
}
.hero .lead{
  font-size:18px;
  max-width:52ch;
  color:#e8e2ff;
  margin-bottom:30px;
}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
.hero-actions a.link{
  color:#fff;
  font-weight:500;
  text-underline-offset:4px;
}
.price-note{
  margin-top:20px;
  font-size:14px;
  color:#d9d0ff;
  max-width:52ch;
}

/* Vídeo de apresentação */
.vsl{justify-self:center;width:min(78vw,300px)}
.vsl .screen{
  position:relative;
  aspect-ratio:404/720;
  border-radius:24px;
  overflow:hidden;
  border:3px solid var(--ink);
  box-shadow:0 14px 0 rgba(21,16,48,.28);
  background:#000;
}
.vsl video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.vsl figcaption{margin-top:24px;font-size:13px;line-height:1.5;color:#d9d0ff}

/* Seções */
section{padding:76px 0}
.section-title{
  font-size:clamp(28px,4vw,42px);
  font-weight:800;
  margin-bottom:14px;
  max-width:20ch;
}
.section-sub{color:var(--muted);max-width:60ch;margin-bottom:38px}

/* O que é */
.about p{max-width:62ch;margin-bottom:14px;color:var(--ink)}
.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:40px;
}
.facts div{padding:4px 24px;border-left:3px solid var(--ink)}
.facts div:first-child{padding-left:0;border-left:0}
.facts h3{font-size:21px;margin-bottom:8px}
.facts p{font-size:15px;color:var(--muted);margin:0}

/* O que você aprende */
.learn{background:var(--white)}
.learn-list{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 56px;
}
.learn-list li{
  padding:20px 0;
  border-top:2px solid var(--ink);
}
.learn-list strong{display:block;font-size:18px;margin-bottom:4px}
.learn-list span{color:var(--muted);font-size:15px}

/* ========================================================
   SEÇÃO FORMATOS COM VÍDEOS IDÊNTICA AO SEU MODELO
   ======================================================== */
.formats-showcase{
  background:#0b0817;
  color:#fff;
  padding:76px 0;
  text-align:center;
}
.formats-showcase h2{
  font-size:clamp(28px, 4vw, 42px);
  font-weight:800;
  margin-bottom:12px;
}
.formats-showcase h2 span{
  color:var(--neon);
}
.formats-showcase .subhead{
  color:#c9c2ea;
  font-size:16px;
  margin-bottom:34px;
}
.formats-reel{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:16px;
  overflow-x:auto;
  padding:10px 20px 30px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.video-card{
  position:relative;
  flex:0 0 180px;
  aspect-ratio:9/16;
  border-radius:18px;
  overflow:hidden;
  background:#1a1433;
  box-shadow:0 12px 28px rgba(0,0,0,.6);
  scroll-snap-align:center;
