<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>IA Academy: guia do curso de influenciador virtual com IA</title>
<meta name="description" content="Veja o que está incluso na IA Academy, curso online sobre criação de vídeos com IA sem aparecer. Página informativa de afiliado.">
<meta name="theme-color" content="#5b2eff">
<script>document.documentElement.classList.add('js');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#151030;
  --ink-soft:#241a52;
  --paper:#f4f2ff;
  --white:#ffffff;
  --violet:#5b2eff;
  --violet-deep:#3f1fc7;
  --sun:#ffc83d;
  --sun-deep:#c9921a;
  --mint:#2bd9a8;
  --rose:#ff5f8d;
  --neon:#bbf900;
  --muted:#5c5778;
  --line:#d9d3f6;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  line-height:1.6;
}
h1,h2,h3{
  font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  line-height:1.08;
  letter-spacing:-0.02em;
}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
a:focus-visible,summary:focus-visible,.btn:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.on-dark a:focus-visible,.on-dark .btn:focus-visible{outline-color:#fff}

.notice{
  background:var(--ink);
  color:#d9d3f6;
  font-size:13px;
  text-align:center;
  padding:9px 16px;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:var(--sun);
  color:var(--ink);
  font-weight:700;
  font-size:17px;
  padding:16px 30px;
  border-radius:999px;
  text-decoration:none;
  box-shadow:0 6px 0 var(--sun-deep);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(3px);box-shadow:0 3px 0 var(--sun-deep)}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--sun-deep)}

.hero{
  background:var(--violet);
  color:#fff;
  padding:56px 0 84px;
  overflow:hidden;
}
.hero-grid{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:40px;
  align-items:center;
}
.hero h1{
  font-size:clamp(36px,6vw,66px);
  font-weight:800;
  margin-bottom:20px;
}
.hero .lead{
  font-size:18px;
  max-width:52ch;
  color:#e8e2ff;
  margin-bottom:30px;
}
.hero-actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px}
.hero-actions a.link{
  color:#fff;
  font-weight:500;
  text-underline-offset:4px;
}
.price-note{
  margin-top:20px;
  font-size:14px;
  color:#d9d0ff;
  max-width:52ch;
}

.vsl{justify-self:center;width:min(78vw,300px)}
.vsl .screen{
  position:relative;
  aspect-ratio:404/720;
  border-radius:24px;
  overflow:hidden;
  border:3px solid var(--ink);
  box-shadow:0 14px 0 rgba(21,16,48,.28);
  background:#000;
}
.vsl video{display:block;width:100%;height:100%;object-fit:cover;background:#000}
.vsl figcaption{margin-top:24px;font-size:13px;line-height:1.5;color:#d9d0ff}

section{padding:76px 0}
.section-title{
  font-size:clamp(28px,4vw,42px);
  font-weight:800;
  margin-bottom:14px;
  max-width:20ch;
}
.section-sub{color:var(--muted);max-width:60ch;margin-bottom:38px}

.about p{max-width:62ch;margin-bottom:14px;color:var(--ink)}
.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  margin-top:40px;
}
.facts div{padding:4px 24px;border-left:3px solid var(--ink)}
.facts div:first-child{padding-left:0;border-left:0}
.facts h3{font-size:21px;margin-bottom:8px}
.facts p{font-size:15px;color:var(--muted);margin:0}

.learn{background:var(--white)}
.learn-list{
  list-style:none;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 56px;
}
.learn-list li{
  padding:20px 0;
  border-top:2px solid var(--ink);
}
.learn-list strong{display:block;font-size:18px;margin-bottom:4px}
.learn-list span{color:var(--muted);font-size:15px}

/* SEÇÃO FORMATOS */
.formats{background:var(--ink);color:#fff}
.formats .section-sub{color:#c9c2ea}
.reel{
  display:flex;
  gap:16px;
  overflow-x:auto;
  padding:6px 20px 24px;
  margin:0 -20px;
  scroll-snap-type:x proximity;
  -webkit-overflow-scrolling:touch;
}
.reel::-webkit-scrollbar{height:8px}
.reel::-webkit-scrollbar-track{background:rgba(255,255,255,.05);border-radius:4px}
.reel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:4px}

.tile{
  position:relative;
  flex:0 0 170px;
  aspect-ratio:9/16;
  border-radius:18px;
  border:2.5px solid rgba(255,255,255,.9);
  scroll-snap-align:start;
  overflow:hidden;
  background:#1f1938;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  transition:transform .2s ease;
}
.tile:hover{
  transform:translateY(-4px);
}
.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#1a1433;
}
.tile::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.3) 30%, transparent 60%);
  pointer-events:none;
}
.tile b{
  position:absolute;
  left:14px;
  bottom:14px;
  z-index:2;
  color:var(--neon);
  font-family:'Bricolage Grotesque','DM Sans',sans-serif;
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:0.06em;
  text-shadow:0 2px 4px rgba(0,0,0,.9);
}
.formats-note{color:#c9c2ea;font-size:14px;max-width:60ch;margin-top:10px}

.mods{
  list-style:none;
  counter-reset:mod;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 56px;
  margin-bottom:56px;
}
.mods li{
  counter-increment:mod;
  display:flex;
  gap:16px;
  align-items:baseline;
  padding:18px 0;
  border-top:2px solid var(--ink);
  font-weight:700;
  font-size:18px;
}
.mods li:before{
  content:"Módulo " counter(mod);
  flex:0 0 auto;
  min-width:86px;
  font-size:13px;
  font-weight:500;
  color:var(--muted);
}
.bonus-title{font-size:24px;font-weight:800;margin-bottom:18px}
.bonus{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.bonus div{
  background:var(--white);
  border:2px solid var(--ink);
  border-radius:18px 18px 18px 4px;
  padding:20px;
}
.bonus h3{font-size:18px;margin-bottom:8px}
.bonus p{font-size:14.5px;color:var(--muted)}

.offer{background:var(--white)}
.offer-panel{
  display:grid;
  grid-template-columns:1.1fr .9fr;
  border:3px solid var(--ink);
  border-radius:30px;
  overflow:hidden;
}
.offer-incl{padding:36px}
.offer-incl h2{font-size:30px;font-weight:800;margin-bottom:18px}
.offer-incl ul{list-style:none;display:grid;gap:10px}
.offer-incl li{padding-left:28px;position:relative}
.offer-incl li:before{
  content:"";
  position:absolute;left:0;top:8px;
  width:14px;height:8px;
  border-left:3px solid var(--violet);
  border-bottom:3px solid var(--violet);
  transform:rotate(-45deg);
}
.offer-buy{
  background:var(--violet);
  color:#fff;
  padding:36px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:10px;
}
.offer-buy .big{
  font-family:'Bricolage Grotesque','DM Sans',sans-serif;
  font-size:clamp(40px,6vw,56px);
  font-weight:800;
  line-height:1;
}
.offer-buy .alt{font-size:17px;color:#e8e2ff}
.offer-buy .fine{font-size:13px;color:#d9d0ff;margin-top:6px}
.offer-buy .btn{margin-top:14px}

.careful{background:var(--ink);color:#fff}
.careful .section-title{max-width:22ch}
.careful ol{list-style:none;max-width:760px}
.careful li{padding:20px 0;border-top:1px solid #4b4278}
.careful li strong{display:block;font-size:18px;margin-bottom:4px}
.careful li span{color:#c9c2ea;font-size:15.5px}

.faq{max-width:780px}
details{border-top:2px solid var(--ink)}
details:last-of-type{border-bottom:2px solid var(--ink)}
summary{
  cursor:pointer;
  list-style:none;
  padding:20px 34px 20px 0;
  font-weight:700;
  font-size:18px;
  position:relative;
}
summary::-webkit-details-marker{display:none}
summary:after{
  content:"+";
  position:absolute;right:4px;top:50%;
  transform:translateY(-50%);
  font-size:26px;font-weight:500;
  transition:transform .2s ease;
}
details[open] summary:after{transform:translateY(-50%) rotate(45deg)}
details p{padding:0 0 20px;color:var(--muted);max-width:64ch}

.final{background:var(--violet);color:#fff;text-align:center}
.final h2{font-size:clamp(30px,5vw,48px);font-weight:800;margin:0 auto 14px;max-width:18ch}
.final p{color:#e8e2ff;max-width:52ch;margin:0 auto 28px}

footer{
  background:var(--ink);
  color:#bdb5e0;
  font-size:13px;
  padding:34px 0 40px;
}
footer p{max-width:78ch;margin-bottom:10px}

.sticky{display:none}

@media (max-width:860px){
  .hero{padding:40px 0 64
